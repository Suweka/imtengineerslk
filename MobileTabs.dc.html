<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:Poppins,system-ui,sans-serif;background:#fff;border-top:1px solid #E8ECF1;padding:9px 8px 14px;display:grid;grid-template-columns:repeat(5,1fr)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ t.color }}">
      <span style="font-family:'Material Symbols Outlined';font-size:22px">{{ t.icon }}</span>
      <span style="font-size:9.5px;font-weight:{{ t.weight }}">{{ t.label }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:70},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Shop&quot;,&quot;Cart&quot;,&quot;Service&quot;,&quot;Account&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "Home";
    const defs = [["Home", "home"], ["Shop", "grid_view"], ["Cart", "shopping_cart"], ["Service", "build"], ["Account", "person"]];
    return {
      tabs: defs.map(([label, icon]) => ({
        label, icon,
        color: label === active ? "#1C75BC" : "#8C9BA9",
        weight: label === active ? 600 : 400
      }))
    };
  }
}
</script>
</body>
</html>
